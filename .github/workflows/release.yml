# Release: builds the NSIS installer and creates a draft GitHub Release for the version in package.json.
# Runs when a push to main changes the version (normally the merge of a bump.yml PR), or by hand
# (to release the current version as is, or to retry a failed run). Pushes no commits, only the vX.Y.Z tag.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# No token permissions by default; each job asks for what it needs (D-53).
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: "0"
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to release
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release only from main (got $GITHUB_REF)."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' src-tauri/Cargo.toml)
          if [ "$tauri" != "$version" ] || [ "$cargo" != "$version" ]; then
            echo "::error::Versions differ: package.json $version, tauri.conf.json $tauri, Cargo.toml $cargo"
            exit 1
          fi
          release=true
          if [ "$EVENT" = "push" ]; then
            previous=$(git show "$BEFORE:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})')
            if [ "$previous" = "$version" ]; then
              echo "The version is still $version: nothing to release."
              release=false
            fi
          fi
          if [ "$release" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            if [ "$EVENT" = "push" ]; then
              echo "Tag v$version already exists: nothing to release."
              release=false
            else
              echo "::error::Tag v$version already exists. Delete the tag (and its release) to rebuild it."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write # push the tag, create the release
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      # The Tag step pushes with the checkout's credentials.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 # zizmor: ignore[artipacked]

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      # The toolchain (version and components) comes from rust-toolchain.toml, the same as locally (D-53).
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # .npmrc (min-release-age, strict-allow-scripts, allow-git) needs npm 11.19+ (D-43).
      - run: npm install -g npm@11.19.1 # zizmor: ignore[adhoc-packages] exact version, needed by .npmrc (D-43)

      - run: npm ci

      # Registry signatures of the npm packages, and the release age of every crate in Cargo.lock (D-43).
      # `cargo fetch --locked` fails if Cargo.lock does not match Cargo.toml instead of re-resolving it.
      - name: Dependency checks
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          npm run deps:check

      - name: Checks
        run: npm run check

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Locate the installer
        id: out
        run: |
          dir=src-tauri/target/release/bundle/nsis
          name="Speechorus_${VERSION}_x64-setup.exe"
          if [ ! -f "$dir/$name" ]; then
            echo "::error::Installer not found: $dir/$name"
            ls -la "$dir" || true
            exit 1
          fi
          (cd "$dir" && sha256sum "$name" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "exe=$dir/$name" >> "$GITHUB_OUTPUT"
          echo "sums=$dir/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EXE: ${{ steps.out.outputs.exe }}
          SUMS: ${{ steps.out.outputs.sums }}
        run: |
          flags=(--draft --generate-notes --verify-tag --title "Speechorus v$VERSION")
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "${flags[@]}" "$EXE" "$SUMS"
          echo "Draft release v$VERSION created from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the merged bump branch
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/release/v$VERSION" >/dev/null; then
            git push origin --delete "release/v$VERSION"
          fi
