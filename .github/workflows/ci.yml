# CI: the same checks as `npm run check`, split into parallel jobs, plus the supply-chain checks (D-53), on every PR into main and every push to main (D-50).
# The frontend checks run on Linux (faster to start); the Rust checks run on Windows, the only platform the app targets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (format, typecheck, Oxlint, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # .npmrc (min-release-age, strict-allow-scripts, allow-git) needs npm 11.19+ (D-43).
      - run: npm install -g npm@11.19.1 # zizmor: ignore[adhoc-packages] exact version, needed by .npmrc (D-43)

      - run: npm ci

      # Registry signatures of the npm packages, and the release age of every crate in Cargo.lock (D-43).
      - name: Dependency checks
        run: npm run deps:check

      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  rust:
    name: Rust (rustfmt, clippy, cargo test)
    runs-on: windows-latest
    timeout-minutes: 45
    # No debug info in CI: smaller artifacts, a smaller rust-cache (faster restore) and faster links (D-51).
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain (version and components) comes from rust-toolchain.toml, the same as locally (D-53).
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Shared with release.yml, which restores this cache for its `npm run check` (D-55).
          shared-key: windows-nodebug

      # `--locked` on clippy and test fails if Cargo.lock does not match Cargo.toml instead of re-resolving it.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  supply-chain:
    name: Supply chain (cargo-deny, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny needs `cargo metadata`, so the toolchain from rust-toolchain.toml is installed first.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # The same cargo-deny as locally, from its release, checked against a pinned SHA-256 (D-53).
      - name: Install cargo-deny
        env:
          DENY_VERSION: "0.21.0"
          DENY_SHA256: a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903
        run: |
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      # RustSec advisories, licenses, bans and crate sources of src-tauri/Cargo.lock (src-tauri/deny.toml).
      - run: cargo deny --manifest-path src-tauri/Cargo.toml --locked check

      # Static analysis of the workflows and dependabot.yml; findings show as annotations on the PR.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
