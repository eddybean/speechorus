# CI: the same checks as `npm run check`, split into two parallel jobs, on every PR into main and every push to main (D-50).
# The frontend checks run on Linux (faster to start); the Rust checks run on Windows, the only platform the app targets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (format, typecheck, Oxlint, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      # .npmrc (min-release-age, strict-allow-scripts, allow-git) needs npm 11.19+ (D-43).
      - run: npm install -g npm@11.19.1

      - run: npm ci

      # Registry signatures of the npm packages, and the release age of every crate in Cargo.lock (D-43).
      - name: Dependency checks
        run: npm run deps:check

      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  rust:
    name: Rust (rustfmt, clippy, cargo test)
    runs-on: windows-latest
    timeout-minutes: 45
    # No debug info in CI: smaller artifacts, a smaller rust-cache (faster restore) and faster links (D-51).
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Pinned like release.yml so that a new stable's clippy lints cannot fail CI; raise both with the local toolchain.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # `--locked` on clippy and test fails if Cargo.lock does not match Cargo.toml instead of re-resolving it.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
