# Dependabot version updates (D-53). Security updates are turned on in the repository settings.
# `cooldown` keeps the 7-day release-age window of .npmrc and scripts/cargo-release-age.mjs (D-43);
# `npm run deps:update` is still the way to refresh the lock files as a whole.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # React and React DOM (and their types) must move together, majors included: a lone react or
      # react-dom bump fails `npm ci` on the peer range (D-56).
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: [minor, patch]
        # Oxfmt is 0.x: a minor update can change the output, so it comes on its own (D-45).
        exclude-patterns: [oxfmt]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(cargo)"

  # Actions are pinned to commit SHAs; Dependabot moves the SHA and the tag comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
